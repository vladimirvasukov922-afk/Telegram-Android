name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Распаковка мода
        run: |
          unzip -o kiokio-mod.zip
          cp -r kiokio-mod/TMessagesProj/src/main/java/tw TMessagesProj/src/main/java/
      - name: Сборка
        run: |
          cd TMessagesProj
          ./gradlew assembleAfatDebug || ./gradlew assembleDebug
      - name: Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: kiokio-apk
          path: TMessagesProj/build/outputs/apk/**/*.apk
