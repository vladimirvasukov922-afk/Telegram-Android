name: Build APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch'
        required: false
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip kio kio mod
        run: |
          unzip -o kiokio-mod.zip
          cp -r kiokio-mod/TMessagesProj/src/main/java/tw TMessagesProj/src/main/java/

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatDebug || ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kiokio-apk
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: warn
